version: '3.8'

services:
  postgres:
    image: postgis/postgis:15-3.3
    container_name: disasterfog_postgres
    environment:
      POSTGRES_USER: disaster_user
      POSTGRES_PASSWORD: disaster_password
      POSTGRES_DB: disasterfog_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U disaster_user -d disasterfog_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: disasterfog_redis
    ports:
      - "6379:6379"

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: disasterfog_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://disaster_user:disaster_password@postgres:5432/disasterfog_db
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=super-secret-key-disasterfog-ai-2026-production-grade
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: disasterfog_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
